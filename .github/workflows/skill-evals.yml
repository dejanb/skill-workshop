name: Skill Evals

on:
  pull_request:
    paths:
      - 'plugins/**/skills/*/SKILL.md'
      - 'plugins/**/skills/*/evals/**'
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        skill:
          - plugins/dev/skills/pre-commit-check/evals
          - plugins/dev/skills/security-review/evals
          - plugins/dev/skills/pr-readiness/evals
    steps:
      - uses: actions/checkout@v4

      - name: Run evals
        uses: promptfoo/promptfoo-action@v1
        with:
          working-directory: ${{ matrix.skill }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
