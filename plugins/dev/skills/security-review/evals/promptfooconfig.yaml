description: 'Security review skill eval'
providers:
  - id: anthropic:claude-agent-sdk
    config:
      working_dir: ../../../../../fixtures/consumer
      append_allowed_tools: ['Read', 'Grep', 'Glob']
tests:
  # --- Trigger tests ---

  # Positive — should trigger this skill
  - vars:
      prompt: 'Review this code for security vulnerabilities'
    assert:
      - type: skill-used
        value: security-review

  # Positive — alternate phrasing
  - vars:
      prompt: 'Run a security scan on the current changes'
    assert:
      - type: skill-used
        value: security-review

  # Near-miss — should trigger style-check, not security-review
  - vars:
      prompt: 'Check if the code follows our naming conventions'
    assert:
      - type: not-skill-used
        value: security-review
      - type: skill-used
        value: style-check

  # Negative — completely unrelated, should trigger nothing
  - vars:
      prompt: 'What time is the standup meeting?'
    assert:
      - type: not-skill-used
        value: security-review

  # --- Execution tests ---

  # Recall — planted command injection vulnerability
  - vars:
      prompt: 'Run security review'
      diff_file: diffs/recall-cmdinject.diff
    assert:
      - type: javascript
        value: |
          const issues = JSON.parse(output).issues || [];
          const found = issues.some(i =>
            /command.inject|shell/i.test(i.description));
          return { pass: found, score: found ? 1 : 0,
            reason: found ? 'Detected injection' : 'Missed injection' };

  # Precision — safe subprocess usage, should not flag
  - vars:
      prompt: 'Run security review'
      diff_file: diffs/precision-subprocess-safe.diff
    assert:
      - type: javascript
        value: |
          const issues = JSON.parse(output).issues || [];
          return { pass: issues.length === 0, score: issues.length === 0 ? 1 : 0,
            reason: issues.length === 0 ? 'No false positive' : `False positive: ${issues[0].description}` };
